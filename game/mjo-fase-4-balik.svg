<text x="100.0" y="60" text-anchor="middle" fill="#3f2d18" font-family="Geologica,system-ui,sans-serif" font-size="17" font-weight="600" letter-spacing="0.3">MJO Fase 4</text>
<rect x="30" y="70" width="140" height="2" fill="#a7761f"/>
<text y="105.4" fill="#3f2d18" fill-opacity=".9" font-family="Geologica,system-ui,sans-serif"
      font-size="11.8" font-weight="300"><tspan x="16" dy="0">MJO itu Madden Julian</tspan><tspan x="16" dy="15.4">Oscillation, gerombolan</tspan><tspan x="16" dy="15.4">awan raksasa yang berjalan</tspan><tspan x="16" dy="15.4">pelan ke timur mengelilingi</tspan><tspan x="16" dy="15.4">khatulistiwa, satu putaran</tspan><tspan x="16" dy="15.4">sekitar 30 sampai 60 hari.</tspan><tspan x="16" dy="15.4">Fase 4 artinya gerombolan</tspan><tspan x="16" dy="15.4">itu sedang berada persis di</tspan><tspan x="16" dy="15.4">atas Indonesia.</tspan></text>
<rect x="30" y="252" width="140" height="2" fill="#a7761f"/>
